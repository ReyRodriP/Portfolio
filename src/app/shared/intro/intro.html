<section
    #introScreen
    class="intro-content"
    role="button"
    tabindex="0"
    aria-label="Entrar al portafolio de Reynaldo Rodríguez Polanco"
    aria-describedby="intro-hint"
    [attr.aria-disabled]="disabled()"
    (click)="irAlPortafolio()"
    (keydown)="onKeydown($event)"
>
    <svg viewBox="0 0 500 175" aria-hidden="true" focusable="false">
        <path id="curve" d="M 50,150 Q 250,20 450,150"/>
        <text textLength="390" lengthAdjust="spacingAndGlyphs">
            <textPath href="#curve" startOffset="50%" text-anchor="middle">
                Reynaldo Rodríguez Polanco
            </textPath> 
        </text>
    </svg>

    <h1 lang="en">WEB DEVELOPER</h1>
    
    <h2><span lang="en">A CREATION BY</span><br> REYNALDO RODRÍGUEZ POLANCO</h2>
    
    <p id="intro-hint" class="intro-hint">Haz clic en cualquier parte para continuar · Enter / Espacio</p>
</section>
