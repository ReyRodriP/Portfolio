@if (visualPreferences.filmEffects()) {
    <div class="film-overlay" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
}

@if (irisFase() === 'idle') {
    <app-visual-settings />
}

@if (introVisible()) {
    <app-intro
        [disabled]="irisFase() !== 'idle'"
        (salir)="iniciarTransicion()"
    />
}

<div class="iris"
     aria-hidden="true"
     [class.cerrando]="irisFase() === 'cerrando'"
     [class.abriendo]="irisFase() === 'abriendo'"
     (animationend)="onIrisFin($event)"></div>

<main
    #content
    class="view-container"
    aria-label="Portafolio de Reynaldo Rodríguez Polanco"
    tabindex="-1"
    [inert]="entradaBloqueada()"
>
        <router-outlet />
</main>
